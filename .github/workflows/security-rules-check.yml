name: Security Rules Validation

on:
  push:
    branches:
      - master
      - dev
      - alt-dev
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/security/**'
      - 'tests/rules/**'
      - 'shared/firebase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-rules-check.yml'
  pull_request:
    branches:
      - master
      - dev
      - alt-dev
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/security/**'
      - 'tests/rules/**'
      - 'shared/firebase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-rules-check.yml'

jobs:
  security_tests:
    name: Verify Security Rules Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run static security rules tests
        run: npm run test:security

      - name: Run Firestore and Storage emulator tests
        run: npm run test:rules

      - name: Report test results
        if: always()
        run: |
          echo "## Security Rules Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Static rule-shape checks and production-faithful emulator tests ran as required steps." >> $GITHUB_STEP_SUMMARY
          echo "See the individual steps above for pass/fail details." >> $GITHUB_STEP_SUMMARY
