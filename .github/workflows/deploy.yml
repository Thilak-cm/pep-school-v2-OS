name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which resources changed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      hosting: ${{ steps.filter.outputs.hosting }}
      functions: ${{ steps.filter.outputs.functions }}
      firestore: ${{ steps.filter.outputs.firestore }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            hosting:
              - 'montessori-os/src/**'
              - 'montessori-os/public/**'
              - 'montessori-os/index.html'
              - 'montessori-os/vite.config.js'
              - 'montessori-os/package.json'
              - 'montessori-os/package-lock.json'
              - 'functions/config/**'
              - 'scripts/config/**'
              - 'firebase.json'
              - '.firebaserc'
            functions:
              - 'functions/**'
            firestore:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'

  deploy_hosting:
    name: Deploy Hosting
    needs: changes
    if: needs.changes.outputs.hosting == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_OPENAI_SPEECH_TO_TEXT_API_KEY: ${{ secrets.VITE_OPENAI_SPEECH_TO_TEXT_API_KEY }}
      VITE_OPENAI_TEXT_CLEANUP_API_KEY: ${{ secrets.VITE_OPENAI_TEXT_CLEANUP_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: cd montessori-os && npm install && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PEP_OS }}
          channelId: live
          projectId: pep-os
          target: app

  deploy_functions:
    name: Deploy Cloud Functions
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: functions
        run: npm install
      - name: Lint
        working-directory: functions
        run: npm run lint
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          # --force is TEMPORARY (one deploy): confirms the off->on failurePolicy
          # transition for the #288 fan-out workers, which non-interactive CI
          # cannot answer. Remove after this deploy succeeds - we deliberately
          # keep the CLI's loud failure as a checkpoint for future failure-policy
          # additions and function deletions (solo-dev repo, no independent PR
          # review to absorb that confirmation).
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PEP_OS }}
      - name: Grant invoker to callable functions
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PEP_OS }}
      - name: Apply allUsers invoker binding
        run: |
          gcloud functions list \
            --regions=asia-south1 \
            --project=pep-os \
            --filter="httpsTrigger:*" \
            --format="value(name)" \
          | while read -r fn; do
              gcloud functions add-invoker-policy-binding "$fn" \
                --region=asia-south1 \
                --project=pep-os \
                --member=allUsers \
                --quiet 2>/dev/null || true
            done

  deploy_firestore:
    name: Deploy Firestore Rules & Indexes
    needs: changes
    if: needs.changes.outputs.firestore == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PEP_OS }}
